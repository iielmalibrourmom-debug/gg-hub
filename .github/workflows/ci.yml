name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r backend/requirements.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-daemon
      - name: Build frontend
        run: npm run build
      - name: Test Electron bridge and validation
        run: npm test
      - name: Test Python backend with isolated D-Bus
        run: |
          PYTHONPATH=backend dbus-run-session -- bash -c 'export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS"; python3 -m unittest discover -s backend/tests -v'
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test design preview
        run: npm run test:ui
      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
